<form role="form" name="form">
  <div class="alert alert-danger" ng-if="orderValidationError">
    {{ orderValidationError }}
  </div>

  <div class="form-group">
    <label for="content">Содержимое</label>
    <input
      id="content"
      name="content"
      class="form-control"
      cam-variable-name="content"
      cam-variable-type="String"
      ng-model="content"
      required
      minlength="2"
      maxlength="150" />
    <p class="help-block" ng-if="form.content.$dirty && form.content.$invalid">
      Укажите содержимое заказа.
    </p>
  </div>

  <div class="form-group">
    <label for="address">Адрес</label>
    <input
      id="address"
      name="address"
      class="form-control"
      cam-variable-name="address"
      cam-variable-type="String"
      ng-model="address"
      required
      minlength="5"
      maxlength="150" />
    <p class="help-block" ng-if="form.address.$dirty && form.address.$invalid">
      Укажите адрес доставки.
    </p>
  </div>

  <script cam-script type="text/form-script">
    camForm.on('form-loaded', function() {
      camForm.variableManager.fetchVariable('orderValidationError');
    });

    camForm.on('variables-fetched', function() {
      $scope.orderValidationError =
        camForm.variableManager.variableValue('orderValidationError');
    });
  </script>
</form>
